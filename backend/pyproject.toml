[project]
name = "oxyss-api"
version = "2.0.0"
description = "Booking API for the Oxyss Style barbershop"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
# S101: asserts in tests; S105/S106: false positives on test fixtures; B008: FastAPI's Depends() idiom.
ignore = ["S101", "S105", "S106", "B008"]
