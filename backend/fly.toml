# Fly.io configuration for the API. Secrets (MONGO_URL, SECRET_KEY, EMAIL_*, GOOGLE_*) are set with
# `fly secrets set`, never here. See docs/deployment.md.

app = 'oxys-barbershop-api'
primary_region = 'ams'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[experimental]
  auto_rollback = true

[build]
  dockerfile = 'Dockerfile'

[env]
  ENVIRONMENT = 'production'
  DB_NAME = 'oxys_barbershop'
  # Browser origins allowed to call the API. Must match the address the website is served from.
  CORS_ORIGINS = 'https://oxyssstyle.ro,https://www.oxyssstyle.ro'
  # Fly's proxy puts the real client address in this header (used for rate limiting).
  CLIENT_IP_HEADER = 'Fly-Client-IP'

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 40

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
